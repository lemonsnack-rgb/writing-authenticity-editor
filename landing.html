<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Writing Authenticity Editor</title>
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{background:#f3f4f6;margin:0;font-family:'Segoe UI',sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh}
.card{background:#fff;border-radius:16px;padding:32px;box-shadow:0 4px 24px rgba(0,0,0,.08);width:400px;text-align:center;transition:transform .2s,box-shadow .2s;cursor:pointer;text-decoration:none;color:inherit;display:block}
.card:hover{transform:translateY(-4px);box-shadow:0 8px 32px rgba(0,0,0,.12)}
</style>
</head>
<body>
<div style="text-align:center">
  <h1 style="font-size:24px;font-weight:700;color:#1f2937;margin-bottom:8px">Writing Authenticity Editor</h1>
  <p style="font-size:14px;color:#9ca3af;margin-bottom:32px">言語を選択してください / 언어를 선택하세요</p>
  <div style="display:flex;gap:20px;justify-content:center;flex-wrap:wrap">
    <a href="index.html" class="card">
      <div style="font-size:40px;margin-bottom:12px">🇰🇷</div>
      <div style="font-size:18px;font-weight:700;color:#1f2937">한국어</div>
      <div style="font-size:13px;color:#6b7280;margin-top:4px">작성 진정성 인증 에디터</div>
    </a>
    <a href="index-jp.html" class="card">
      <div style="font-size:40px;margin-bottom:12px">🇯🇵</div>
      <div style="font-size:18px;font-weight:700;color:#1f2937">日本語</div>
      <div style="font-size:13px;color:#6b7280;margin-top:4px">作成真正性認証エディタ</div>
    </a>
  </div>
</div>
</body>
</html>
