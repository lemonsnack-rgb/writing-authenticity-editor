<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>작성 진정성 인증 에디터</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{background:#f3f4f6;margin:0;font-family:'Segoe UI',sans-serif}
.editor-area{min-height:250px;padding:16px;font-size:16px;line-height:1.8;border:2px solid #d1d5db;border-radius:8px;background:#fff;outline:none;white-space:pre-wrap;word-wrap:break-word}
.editor-area:focus{border-color:#6366f1;box-shadow:0 0 0 3px rgba(99,102,241,.1)}
.editor-area:empty::before{content:'여기에 글을 작성하세요. 타이핑과 붙여넣기가 자동으로 구분됩니다...';color:#9ca3af;pointer-events:none}
.tt{position:relative;display:inline;cursor:pointer}
.tt-box{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:#1f2937;color:#fff;padding:10px 14px;border-radius:8px;font-size:12px;line-height:1.5;white-space:normal;min-width:240px;max-width:380px;z-index:50;pointer-events:none;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.tt-box::after{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);border:6px solid transparent;border-top-color:#1f2937}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* 재생 플레이어 */
.replay-area{min-height:200px;padding:16px;font-size:16px;line-height:1.8;border:2px solid #e5e7eb;border-radius:8px;background:#fff;white-space:pre-wrap;word-wrap:break-word;word-break:break-all;overflow-wrap:break-word;position:relative}

.login-logo{width:56px;height:56px;background:linear-gradient(135deg,#6366f1,#4f46e5);border-radius:14px;display:flex;align-items:center;justify-content:center;margin:0 auto 20px}
.login-input{width:100%;padding:12px 16px;border:2px solid #e5e7eb;border-radius:8px;font-size:15px;outline:none;transition:border-color .2s;box-sizing:border-box}
.login-input:focus{border-color:#6366f1;box-shadow:0 0 0 3px rgba(99,102,241,.1)}
.login-btn{width:100%;padding:13px;background:linear-gradient(135deg,#6366f1,#4f46e5);color:#fff;border:none;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer;transition:opacity .2s;margin-top:8px}
.login-btn:hover{opacity:.9}

</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useRef,useEffect,useCallback} = React;

/* ═══ 1. DIFF ═══ */
function simpleDiff(o,n){
  if(o===n)return null;
  let p=0;const m=Math.min(o.length,n.length);
  while(p<m&&o[p]===n[p])p++;
  let oS=0,nS=0;
  while(oS<o.length-p&&nS<n.length-p&&o[o.length-1-oS]===n[n.length-1-nS]){oS++;nS++}
  return{pos:p,deleted:o.slice(p,o.length-oS),inserted:n.slice(p,n.length-nS)};
}

/* ═══ 2. 전역 상태 ═══ */
const S={
  charMeta:[],prevText:'',pasteEvents:[],nextPasteId:1,
  deleteCount:0,pasteDeleteCount:0,pasteEditInserts:0,
  inputIntervals:[],lastInputTime:null,listeners:[],
  // ★ 오퍼레이션 로그 (재생용)
  opLog:[],  // [{type:'insert'|'delete'|'paste', pos, deleted, inserted, timestamp, pasteId?}]
  startTime:null,
};
function notify(){S.listeners.forEach(f=>f())}

/* ═══ 3. 이벤트 핸들러 ═══ */
function attachEvents(el){
  if(!el||el._bound)return;el._bound=true;

  el.addEventListener('paste',e=>{
    e.preventDefault();
    const text=e.clipboardData.getData('text/plain');
    if(!text)return;
    const now=Date.now();
    if(!S.startTime)S.startTime=now;
    const tb=el.textContent;
    const sel=window.getSelection();
    if(sel.rangeCount){const r=sel.getRangeAt(0);r.deleteContents();const nd=document.createTextNode(text);r.insertNode(nd);r.setStartAfter(nd);r.collapse(true);sel.removeAllRanges();sel.addRange(r)}
    const ta=el.textContent;
    const d=simpleDiff(tb,ta);if(!d)return;
    if(d.deleted.length>0){for(let i=d.pos;i<d.pos+d.deleted.length&&i<S.charMeta.length;i++){if(S.charMeta[i]?.origin==='paste')S.pasteDeleteCount++}S.charMeta.splice(d.pos,d.deleted.length)}
    const id=S.nextPasteId++;
    S.pasteEvents.push({id,originalText:text,timestamp:now});
    const entries=[];for(let i=0;i<d.inserted.length;i++)entries.push({origin:'paste',pasteId:id,timestamp:now});
    S.charMeta.splice(d.pos,0,...entries);
    // ★ 로그 기록
    S.opLog.push({type:'paste',pos:d.pos,deleted:d.deleted,inserted:d.inserted,timestamp:now,pasteId:id});
    S.prevText=ta;notify();
  });

  el.addEventListener('input',e=>{
    const cur=el.textContent;if(cur===S.prevText)return;
    const now=Date.now();
    if(!S.startTime)S.startTime=now;
    const d=simpleDiff(S.prevText,cur);if(!d){S.prevText=cur;return}
    let logType='insert';
    if(d.deleted.length>0){
      for(let i=d.pos;i<d.pos+d.deleted.length&&i<S.charMeta.length;i++){if(S.charMeta[i]?.origin==='paste'||S.charMeta[i]?.origin==='typed-in-paste')S.pasteDeleteCount++}
      S.deleteCount+=d.deleted.length;S.charMeta.splice(d.pos,d.deleted.length);
      logType=d.inserted.length>0?'replace':'delete';
    }
    if(d.inserted.length>0){
      const before=d.pos>0?S.charMeta[d.pos-1]:null;const after=d.pos<S.charMeta.length?S.charMeta[d.pos]:null;
      const inP=before&&after&&(before.origin==='paste'||before.origin==='typed-in-paste')&&(after.origin==='paste'||after.origin==='typed-in-paste')&&before.pasteId!=null&&before.pasteId===after.pasteId;
      const entries=[];for(let i=0;i<d.inserted.length;i++)entries.push({origin:inP?'typed-in-paste':'typing',pasteId:inP?before.pasteId:null,timestamp:now});
      S.charMeta.splice(d.pos,0,...entries);if(inP)S.pasteEditInserts+=d.inserted.length;
      if(S.lastInputTime){const iv=now-S.lastInputTime;if(iv>0&&iv<10000)S.inputIntervals.push(iv)}
      S.lastInputTime=now;
    }
    // ★ 로그 기록
    S.opLog.push({type:logType,pos:d.pos,deleted:d.deleted,inserted:d.inserted,timestamp:now});
    // desync 방지: splice 후 길이 불일치 시 보정
    if(S.charMeta.length!==cur.length){while(S.charMeta.length>cur.length)S.charMeta.pop();while(S.charMeta.length<cur.length)S.charMeta.push({origin:'typing',pasteId:null,timestamp:now})}
    S.prevText=cur;notify();
  });
}

/* ═══ 4. 행동 휴리스틱 분석 ═══ */
function analyzeHeuristics(opLog){
  if(opLog.length<3)return{nonlinear:{score:0,detail:'데이터 부족'},thinking:{score:0,detail:'데이터 부족'},editQuality:{score:0,detail:'데이터 부족'},rhythm:{score:0,detail:'데이터 부족'},behaviorScore:0};
  // (a) 비선형 편집 — 커서가 앞으로 점프하는 빈도
  let totalOps=0,backJumps=0,lastEnd=0;
  for(const op of opLog){
    if(op.inserted.length>0&&op.pos<lastEnd-1)backJumps++;
    lastEnd=op.pos+op.inserted.length;totalOps++;
  }
  const nlRatio=totalOps>0?backJumps/totalOps:0;
  const nlScore=Math.min(100,Math.round(nlRatio*500));
  // (b) 사고 정지 구간 — 멈춤 + 직후 행동 연계 검증
  let pauses=0;
  for(let i=1;i<opLog.length;i++){
    const g=opLog[i].timestamp-opLog[i-1].timestamp;
    if(g<2000||g>=15000)continue;
    if(opLog[i].type==='paste'||opLog[i-1].type==='paste')continue;
    // 직전 커서 끝 위치
    const prevEnd=opLog[i-1].pos+opLog[i-1].inserted.length;
    // 직후 3개 오퍼레이션 내에서 역방향 이동 또는 내용 수정이 있는지 검사
    let valid=false;
    let checkEnd=prevEnd;
    for(let j=i;j<Math.min(i+3,opLog.length);j++){
      const op=opLog[j];
      if(op.pos<checkEnd-1){valid=true;break}
      if(op.deleted.length>=3){valid=true;break}
      if(op.deleted.length>0&&op.inserted.length>=2){valid=true;break}
      checkEnd=op.pos+op.inserted.length;
    }
    if(valid)pauses++;
  }
  const totalTime=opLog[opLog.length-1].timestamp-opLog[0].timestamp;
  const pauseRate=totalTime>0?(pauses*3000)/totalTime:0;
  const thScore=Math.min(100,Math.round(pauseRate*200));
  // (c) 수정 패턴 질 — 오타(1~2자 교체) vs 내용(3자+)
  let typo=0,content=0;
  for(const op of opLog){if(op.deleted.length>0){if(op.deleted.length<=2&&op.inserted.length<=2&&op.inserted.length>0)typo++;else if(op.deleted.length>=2||(op.deleted.length>0&&op.inserted.length>=2))content++}}
  const eqScore=(typo+content)>0?Math.round(content/(typo+content)*100):0;
  const behaviorScore=Math.round(nlScore*0.4+thScore*0.35+eqScore*0.25);
  return{
    nonlinear:{score:nlScore,detail:'커서 역방향 이동 '+backJumps+'회/'+totalOps+'회 (비선형 편집)'},
    thinking:{score:thScore,detail:'유효 사고 정지 '+pauses+'회 (멈춤 후 수정·역방향 이동 동반)'},
    editQuality:{score:eqScore,detail:'오타수정 '+typo+'회, 내용수정 '+content+'회'},
    behaviorScore,
  };
}

/* ═══ 5. 기계적 분석 ═══ */
function runAnalysis(){
  const el=document.querySelector('.editor-area');if(!el)return null;
  const text=el.textContent;const meta=S.charMeta;
  if(!text.length||!meta.length)return null;
  // desync 자동 복구: charMeta 길이를 텍스트에 맞춤
  if(text.length!==meta.length){
    console.warn('charMeta desync 복구:',meta.length,'→',text.length);
    while(S.charMeta.length>text.length)S.charMeta.pop();
    while(S.charMeta.length<text.length)S.charMeta.push({origin:'typing',pasteId:null,timestamp:Date.now()});
    S.prevText=text;
  }
  const pgS={};
  S.pasteEvents.forEach(pe=>{const rem=meta.filter(m=>m.pasteId===pe.id&&m.origin==='paste').length;const ins=meta.filter(m=>m.pasteId===pe.id&&m.origin==='typed-in-paste').length;const del=pe.originalText.length-rem;pgS[pe.id]={originalLen:pe.originalText.length,remaining:rem,inserted:ins,deleted:del,wasEdited:ins>0||del>0,originalText:pe.originalText}});
  const citIds=new Set();
  S.pasteEvents.forEach(pe=>{let f=-1,l=-1;for(let i=0;i<meta.length;i++){if(meta[i].pasteId===pe.id){if(f<0)f=i;l=i}}if(f<0)return;const ctx=text.slice(Math.max(0,f-30),Math.min(text.length,l+30));const pats=[/["""]/, /https?:\/\//i,/www\./i,/출처/i,/참고/i,/인용/i,/참조/i,/source/i,/ref/i,/cite/i,/\[\d+\]/,/\(.*\d{4}\)/];if(pats.some(p=>p.test(ctx)))citIds.add(pe.id)});
  const dts=meta.map(m=>{if(m.origin==='typing')return'typing';if(m.origin==='typed-in-paste')return'insert-in-paste';if(m.origin==='paste'){if(citIds.has(m.pasteId))return'citation';if(pgS[m.pasteId]?.wasEdited)return'paste-edited';return'paste-clean'}return'typing'});
  const blocks=[];let cur=null;
  for(let i=0;i<text.length;i++){const dt=dts[i];const pid=meta[i].pasteId;if(cur&&cur.dt===dt&&cur.pid===pid){cur.text+=text[i];cur.end=i}else{if(cur)blocks.push(cur);cur={dt,pid,text:text[i],start:i,end:i}}}
  if(cur)blocks.push(cur);
  blocks.forEach(b=>{const len=b.text.length;if(b.dt==='typing'){const ivs=[];for(let i=b.start+1;i<=b.end&&i<meta.length;i++){const d=meta[i].timestamp-meta[i-1].timestamp;if(d>0&&d<10000)ivs.push(d)}const avg=ivs.length>0?Math.round(ivs.reduce((a,c)=>a+c,0)/ivs.length):0;const cpm=avg>0?Math.round(60000/avg):0;b.evidence=len+'자 직접 입력, 평균 '+cpm+'타/분'}else if(b.dt==='paste-clean'){b.evidence=len+'자 동시 유입 (수정 없음)'}else if(b.dt==='paste-edited'){const gs=pgS[b.pid];b.evidence='원본 '+gs.originalLen+'자 → 잔존 '+gs.remaining+'자 (삭제 '+gs.deleted+', 추가 '+gs.inserted+')'}else if(b.dt==='insert-in-paste'){b.evidence='붙여넣기 영역 내 직접 '+len+'자 입력'}else if(b.dt==='citation'){b.evidence=len+'자 붙여넣기, 인용/출처 표기 발견'}});
  const counts={typing:0,'paste-clean':0,'paste-edited':0,'insert-in-paste':0,citation:0};dts.forEach(dt=>counts[dt]++);
  const total=text.length;const w=counts.typing*1+counts['insert-in-paste']*.7+counts['paste-edited']*.3+counts.citation*.5;
  const score=total>0?Math.round(w/total*100):0;
  let grade,gradeLabel;if(score>=80){grade='excellent';gradeLabel='우수'}else if(score>=50){grade='normal';gradeLabel='보통'}else{grade='reject';gradeLabel='거절'}
  const avgCPM=S.inputIntervals.length>0?Math.round(60000/(S.inputIntervals.reduce((a,b)=>a+b,0)/S.inputIntervals.length)):0;
  // ★ 행동 휴리스틱 통합
  const heuristics=analyzeHeuristics(S.opLog);
  const mechScore=score; // 기계적 점수 (기존)
  const behScore=heuristics.behaviorScore; // 행동 점수
  const finalScore=Math.round(mechScore*0.5+behScore*0.5); // 종합
  let fGrade,fLabel;
  if(finalScore>=70){fGrade='excellent';fLabel='우수'}else if(finalScore>=40){fGrade='normal';fLabel='보통'}else{fGrade='reject';fLabel='거절'}
  return{blocks,counts,total,mechScore,behScore,finalScore,grade:fGrade,gradeLabel:fLabel,avgCPM,deleteCount:S.deleteCount,pgStats:pgS,pasteEditInserts:S.pasteEditInserts,pasteDeleteCount:S.pasteDeleteCount,heuristics};
}

/* ═══ 5. 재생 모달 ═══ */
function ReplayModal({opLog,onClose}){
  // ESC 키로 닫기
  useEffect(()=>{
    const handler=e=>{if(e.key==='Escape')onClose()};
    window.addEventListener('keydown',handler);
    return()=>window.removeEventListener('keydown',handler);
  },[onClose]);
  return(
    <div style={{position:'fixed',inset:0,zIndex:1000,display:'flex',alignItems:'center',justifyContent:'center'}}>
      <div style={{position:'absolute',inset:0,background:'rgba(0,0,0,0.5)'}} onClick={onClose}></div>
      <div style={{position:'relative',width:'90%',maxWidth:'800px',maxHeight:'90vh',overflow:'auto',background:'var(--bg-color,#f3f4f6)',borderRadius:'16px',boxShadow:'0 25px 50px rgba(0,0,0,0.25)',padding:'24px'}}>
        <button onClick={onClose} style={{position:'absolute',top:'12px',right:'16px',background:'none',border:'none',fontSize:'24px',cursor:'pointer',color:'var(--text-secondary,#6b7280)',lineHeight:1}}>✕</button>
        <ReplayPlayer opLog={opLog} onClose={onClose} />
      </div>
    </div>
  );
}

function ReplayPlayer({opLog,onClose}){
  const [playing,setPlaying]=useState(false);
  const [speed,setSpeed]=useState(4);
  const [currentIdx,setCurrentIdx]=useState(0);
  const [replayText,setReplayText]=useState('');
  const [cursorPos,setCursorPos]=useState(0);
  const [lastOpType,setLastOpType]=useState(null);
  const [lastPasteLen,setLastPasteLen]=useState(0);
  const timerRef=useRef(null);
  const textRef=useRef('');
  const idxRef=useRef(0);
  const cursorElRef=useRef(null);

  const totalOps=opLog.length;
  const totalTime=totalOps>0?opLog[totalOps-1].timestamp-opLog[0].timestamp:0;

  // 특정 인덱스까지 오퍼레이션 적용하여 텍스트 재구성
  const buildTextUpTo=useCallback((idx)=>{
    let t='';
    let pos=0;
    for(let i=0;i<=idx&&i<opLog.length;i++){
      const op=opLog[i];
      if(op.deleted.length>0){t=t.slice(0,op.pos)+t.slice(op.pos+op.deleted.length)}
      if(op.inserted.length>0){t=t.slice(0,op.pos)+op.inserted+t.slice(op.pos)}
      pos=op.pos+op.inserted.length;
    }
    return{text:t,cursorPos:pos};
  },[opLog]);

  // 재생 스텝
  const step=useCallback(()=>{
    if(idxRef.current>=totalOps){setPlaying(false);return}
    const op=opLog[idxRef.current];
    let t=textRef.current;
    if(op.deleted.length>0){t=t.slice(0,op.pos)+t.slice(op.pos+op.deleted.length)}
    if(op.inserted.length>0){t=t.slice(0,op.pos)+op.inserted+t.slice(op.pos)}
    textRef.current=t;
    setReplayText(t);
    setCursorPos(op.pos+op.inserted.length);
    setLastOpType(op.type);
    setLastPasteLen(op.type==='paste'?op.inserted.length:0);
    idxRef.current++;
    setCurrentIdx(idxRef.current);
  },[opLog,totalOps]);

  // 재생 루프
  useEffect(()=>{
    if(!playing)return;
    const run=()=>{
      if(idxRef.current>=totalOps){setPlaying(false);return}
      step();
      // 다음 오퍼레이션까지의 딜레이 계산
      if(idxRef.current<totalOps){
        const cur=opLog[idxRef.current-1];
        const next=opLog[idxRef.current];
        let delay=(next.timestamp-cur.timestamp)/speed;
        delay=Math.max(10,Math.min(delay,500)); // 10ms ~ 500ms 범위로 제한
        timerRef.current=setTimeout(run,delay);
      }
    };
    run();
    return()=>{if(timerRef.current)clearTimeout(timerRef.current)};
  },[playing,speed,step,opLog,totalOps]);

  const handlePlayPause=()=>{
    if(currentIdx>=totalOps){
      // 처음부터 다시
      idxRef.current=0;setCurrentIdx(0);textRef.current='';setReplayText('');setCursorPos(0);
    }
    setPlaying(!playing);
  };
  const handleReset=()=>{
    setPlaying(false);if(timerRef.current)clearTimeout(timerRef.current);
    idxRef.current=0;setCurrentIdx(0);textRef.current='';setReplayText('');setCursorPos(0);setLastOpType(null);
  };
  const handleSeek=(e)=>{
    const rect=e.currentTarget.getBoundingClientRect();
    const pct=(e.clientX-rect.left)/rect.width;
    const idx=Math.round(pct*totalOps);
    setPlaying(false);if(timerRef.current)clearTimeout(timerRef.current);
    const{text,cursorPos:cp}=buildTextUpTo(idx-1);
    textRef.current=text;setReplayText(text);setCursorPos(cp);
    idxRef.current=idx;setCurrentIdx(idx);
  };

  // 커서 위치로 자동 스크롤
  useEffect(()=>{
    if(cursorElRef.current){cursorElRef.current.scrollIntoView({behavior:'smooth',block:'center',inline:'nearest'})}
  },[cursorPos,currentIdx]);

  // 렌더링: 커서 위치에 블링크 커서 삽입
  const renderText=()=>{
    const t=replayText;
    const pos=Math.min(cursorPos,t.length);
    const before=t.slice(0,pos);
    const after=t.slice(pos);

    // 마지막 붙여넣기 하이라이트
    if(lastOpType==='paste'&&lastPasteLen>0){
      const pStart=pos-lastPasteLen;
      const beforePaste=t.slice(0,Math.max(0,pStart));
      const pasteText=t.slice(Math.max(0,pStart),pos);
      return <>{beforePaste}<span className="paste-flash" style={{background:'rgba(239,68,68,.15)'}}>{pasteText}</span><span ref={cursorElRef} className="cursor-blink"></span>{after}</>;
    }
    return <>{before}<span ref={cursorElRef} className="cursor-blink"></span>{after}</>;
  };

  const elapsed=currentIdx>0&&currentIdx<=totalOps?opLog[currentIdx-1].timestamp-opLog[0].timestamp:0;
  const pct=totalOps>0?(currentIdx/totalOps*100):0;

  return(
    <div className="fade-in">
      <div className="bg-white rounded-xl shadow-lg p-6 mb-4">
        <div className="flex justify-between items-center mb-3">
          <div className="flex items-center gap-3">
            <label className="text-sm font-semibold text-gray-600">작성 과정 재생</label>
            {lastOpType&&<span className={'op-tag '+(lastOpType==='paste'?'bg-red-100 text-red-700':lastOpType==='delete'?'bg-gray-100 text-gray-700':'bg-green-100 text-green-700')}>
              {lastOpType==='paste'?'붙여넣기':lastOpType==='delete'?'삭제':'타이핑'}
            </span>}
          </div>
          <div className="text-xs text-gray-400">
            <span>{currentIdx}/{totalOps} 오퍼레이션</span>
            <span className="ml-3">{(elapsed/1000).toFixed(1)}초 / {(totalTime/1000).toFixed(1)}초</span>
          </div>
        </div>
        <div className="replay-area">{replayText.length===0&&currentIdx===0?<span className="text-gray-300">재생을 시작하세요...</span>:renderText()}</div>

        {/* 컨트롤 */}
        <div className="replay-controls">
          <button onClick={handlePlayPause} className="px-4 py-2 bg-indigo-600 text-white rounded-lg font-semibold hover:bg-indigo-700 transition-colors text-sm">
            {playing?'⏸ 일시정지':currentIdx>=totalOps?'⟳ 다시재생':'▶ 재생'}
          </button>
          <button onClick={handleReset} className="px-3 py-2 bg-indigo-100 text-indigo-700 rounded-lg text-sm hover:bg-indigo-200">⏮ 처음</button>

          {/* 프로그레스 바 */}
          <div className="progress-track" onClick={handleSeek}>
            <div className="progress-fill" style={{width:pct+'%'}}></div>
          </div>

          {/* 배속 */}
          {[1,2,4,8,16].map(s=>(
            <button key={s} onClick={()=>setSpeed(s)} className={'speed-btn'+(speed===s?' active':'')}>
              {s}x
            </button>
          ))}
        </div>
      </div>
      <div className="text-center">
        <button onClick={onClose} className="px-6 py-2 bg-indigo-100 text-indigo-700 rounded-lg font-semibold hover:bg-indigo-200 transition-colors">닫기</button>
      </div>
    </div>
  );
}

        <div className="text-sm font-semibold text-gray-600 mb-3">붙여넣기 이벤트별 수정 내역</div>
        <div className="space-y-3">{Object.entries(pgStats).map(([id,gs])=>(<div key={id} className="border rounded-lg p-3"><div className="flex items-center gap-2 mb-2"><span className={gs.wasEdited?'bg-orange-100 text-orange-800 text-xs px-2 py-1 rounded-full font-semibold':'bg-red-100 text-red-800 text-xs px-2 py-1 rounded-full font-semibold'}>{gs.wasEdited?'수정됨':'원본 유지'}</span><span className="text-xs text-gray-400">원본 {gs.originalLen}자</span></div><div className="text-xs text-gray-500 truncate">원본: "{gs.originalText.slice(0,60)}{gs.originalText.length>60?'...':''}"</div>{gs.wasEdited&&<div className="text-xs text-gray-600 mt-1">잔존: <strong>{gs.remaining}자</strong>{gs.deleted>0&&<span className="text-red-500 ml-2">삭제: {gs.deleted}자</span>}{gs.inserted>0&&<span className="text-blue-500 ml-2">추가: {gs.inserted}자</span>}</div>}</div>))}</div>
      </div>}
      <div className="bg-white rounded-xl shadow-lg p-6 mb-6">
        <div className="text-sm font-semibold text-gray-600 mb-3">블록별 상세 분석</div>
        <div className="space-y-2 max-h-64 overflow-y-auto">{blocks.map((b,i)=>{const tr=b.text.length>40?b.text.slice(0,40)+'...':b.text;return(<div key={i} className="flex items-start gap-3 p-2 rounded hover:bg-gray-50"><span className={dtB(b.dt)+' text-xs px-2 py-1 rounded-full font-semibold whitespace-nowrap'}>{dtL(b.dt)}</span><div className="flex-1 min-w-0"><div className="text-sm text-gray-700 truncate">{tr}</div><div className="text-xs text-gray-400 mt-1">{b.evidence}</div></div><span className="text-xs text-gray-400 whitespace-nowrap">{b.text.length}자</span></div>)})}</div>
      </div>
      <div className="flex gap-3 justify-center">
        {hasOpLog&&<button onClick={onReplay} className="px-6 py-3 bg-green-600 text-white rounded-lg font-semibold hover:bg-green-700 transition-colors shadow-md">작성 과정 재생</button>}
        <button onClick={onBack} className="px-6 py-3 bg-indigo-100 text-indigo-700 rounded-lg font-semibold hover:bg-indigo-200 transition-colors">에디터로 돌아가기</button>
      </div>
    </div>
  );
}

ReactDOM.render(<Root/>,document.getElementById('root'));
</script>
</body>
</html>
