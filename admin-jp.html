<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理者設定 — 作成真正性認証エディタ</title>
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{background:#f3f4f6;margin:0;font-family:'Segoe UI','Hiragino Sans',sans-serif}
input[type=number]{width:80px;padding:4px 8px;border:1px solid #d1d5db;border-radius:6px;font-size:14px;text-align:right}
input[type=number]:focus{outline:none;border-color:#6366f1;box-shadow:0 0 0 2px rgba(99,102,241,.2)}
.section{background:#fff;border-radius:12px;padding:20px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #f3f4f6}
.row:last-child{border-bottom:none}
.label{font-size:13px;color:#374151}
.desc{font-size:11px;color:#9ca3af;margin-top:2px}
</style>
</head>
<body>
<div class="max-w-2xl mx-auto p-6">
  <header class="text-center mb-6">
    <h1 class="text-2xl font-bold text-gray-800">管理者設定</h1>
    <p class="text-gray-500 text-sm mt-1">分析閾値、加重値、等級基準を調整します</p>
    <a href="index-jp.html" class="text-xs text-indigo-500 hover:text-indigo-700">← エディタに戻る</a>
  </header>
  <div id="app"></div>
</div>
<script>
// ── 設定読み込み (index-jp.htmlと同一構造) ──
const DEFAULT_CONFIG = {
  mechWeights:{typing:1.0,'insert-in-paste':0.7,citation:0.5,'paste-edited':0.3,'paste-clean':0.0},
  behaviorWeights:{nonlinear:0.4,thinking:0.35,editQuality:0.25},
  finalScoreRatio:{mechanical:0.5,behavioral:0.5},
  nonlinear:{scaleFactor:500},
  thinking:{minPauseMs:2000,maxPauseMs:15000,lookAheadOps:3,minDeleteForContent:3,minInsertForContent:2,pauseWeight:3000,scoreScale:200},
  editQuality:{typoMaxLength:1,contentMinDelete:2,contentMinInsert:2},
  grades:{excellent:70,normal:40},
  citation:{contextRange:30,patterns:['[「」『』"""]','https?:\\/\\/','www\\.','参考','引用','出典','出所','source','ref','cite','\\[\\d+\\]','\\(.*\\d{4}\\)']},
  replay:{minDelayMs:10,maxDelayMs:500,speeds:[1,2,4,8,16]},
  input:{maxIntervalMs:10000},
};
function deepMerge(t,s){const r={...t};for(const k of Object.keys(s)){if(s[k]&&typeof s[k]==='object'&&!Array.isArray(s[k])){r[k]=deepMerge(t[k]||{},s[k])}else{r[k]=s[k]}}return r}
function loadConfig(){try{const s=localStorage.getItem('authenticity-editor-config-jp');if(s)return deepMerge(DEFAULT_CONFIG,JSON.parse(s))}catch(e){}return JSON.parse(JSON.stringify(DEFAULT_CONFIG))}
function saveConfig(c){localStorage.setItem('authenticity-editor-config-jp',JSON.stringify(c))}

let config = loadConfig();

// ── UIレンダリング ──
const sections = [
  {
    title: '機械的分析 — 文字流入経路別加重値',
    desc: '各タイプの文字がスコアに寄与する比率（0.0〜1.0）',
    fields: [
      { path: 'mechWeights.typing', label: '直接タイピング', desc: 'キーボードで直接入力', step: 0.1 },
      { path: 'mechWeights.insert-in-paste', label: '貼付内挿入', desc: '貼り付け領域内で直接入力', step: 0.1 },
      { path: 'mechWeights.citation', label: '引用貼り付け', desc: '出典表記のある貼り付け', step: 0.1 },
      { path: 'mechWeights.paste-edited', label: '修正済み貼付', desc: '貼り付け後に修正されたブロック', step: 0.1 },
      { path: 'mechWeights.paste-clean', label: '単純貼り付け', desc: '修正なしでそのまま残った貼り付け', step: 0.1 },
    ]
  },
  {
    title: '行動分析 — シグナル別加重値',
    desc: '合計が1.0になるようにしてください',
    fields: [
      { path: 'behaviorWeights.nonlinear', label: '非線形編集', desc: 'カーソル逆方向移動の頻度', step: 0.05 },
      { path: 'behaviorWeights.thinking', label: '思考停止', desc: '有効思考停止の回数', step: 0.05 },
      { path: 'behaviorWeights.editQuality', label: '修正パターン質', desc: '内容修正の比率', step: 0.05 },
    ]
  },
  {
    title: '総合スコア — 結合比率',
    desc: '機械的/行動スコアの結合比率（合計1.0）',
    fields: [
      { path: 'finalScoreRatio.mechanical', label: '機械的分析の比率', step: 0.1 },
      { path: 'finalScoreRatio.behavioral', label: '行動分析の比率', step: 0.1 },
    ]
  },
  {
    title: '思考停止 — 閾値',
    fields: [
      { path: 'thinking.minPauseMs', label: '最小停止時間（ms）', desc: 'これ以上止まると思考停止候補', step: 500 },
      { path: 'thinking.maxPauseMs', label: '最大停止時間（ms）', desc: 'これ以上は離席と判断', step: 1000 },
      { path: 'thinking.lookAheadOps', label: '検査オペレーション数', desc: '停止後この数だけ後続行動を検査', step: 1 },
      { path: 'thinking.minDeleteForContent', label: '内容削除最小長', desc: 'これ以上削除で内容修正と判断', step: 1 },
      { path: 'thinking.minInsertForContent', label: '内容挿入最小長', desc: 'これ以上挿入で内容修正と判断', step: 1 },
    ]
  },
  {
    title: '修正パターン質 — 閾値',
    fields: [
      { path: 'editQuality.typoMaxLength', label: '誤字最大長', desc: 'これ以下の削除+挿入は誤字修正に分類', step: 1 },
      { path: 'editQuality.contentMinDelete', label: '内容修正最小削除', step: 1 },
      { path: 'editQuality.contentMinInsert', label: '内容修正最小挿入', step: 1 },
    ]
  },
  {
    title: '等級カットライン',
    fields: [
      { path: 'grades.excellent', label: '優秀の最低点', step: 5 },
      { path: 'grades.normal', label: '普通の最低点', step: 5 },
    ]
  },
  {
    title: '引用検出',
    fields: [
      { path: 'citation.contextRange', label: '周辺検索範囲（文字数）', step: 5 },
    ]
  },
  {
    title: 'その他',
    fields: [
      { path: 'nonlinear.scaleFactor', label: '非線形スケールファクター', step: 50 },
      { path: 'input.maxIntervalMs', label: '入力間隔最大（ms）', step: 1000 },
      { path: 'replay.minDelayMs', label: '再生最小ディレイ（ms）', step: 5 },
      { path: 'replay.maxDelayMs', label: '再生最大ディレイ（ms）', step: 50 },
    ]
  },
];

function getVal(obj, path) {
  return path.split('.').reduce((o, k) => o?.[k], obj);
}
function setVal(obj, path, val) {
  const keys = path.split('.');
  let o = obj;
  for (let i = 0; i < keys.length - 1; i++) o = o[keys[i]];
  o[keys[keys.length - 1]] = val;
}

function render() {
  const app = document.getElementById('app');
  let html = '';

  sections.forEach(sec => {
    html += '<div class="section">';
    html += '<h2 class="text-sm font-bold text-gray-700 mb-1">' + sec.title + '</h2>';
    if (sec.desc) html += '<p class="text-xs text-gray-400 mb-3">' + sec.desc + '</p>';
    sec.fields.forEach(f => {
      const val = getVal(config, f.path);
      html += '<div class="row">';
      html += '<div><div class="label">' + f.label + '</div>';
      if (f.desc) html += '<div class="desc">' + f.desc + '</div>';
      html += '</div>';
      html += '<input type="number" value="' + val + '" step="' + (f.step || 1) + '" data-path="' + f.path + '" />';
      html += '</div>';
    });
    html += '</div>';
  });

  // ボタン
  html += '<div class="flex gap-3 justify-center mt-6 mb-4">';
  html += '<button id="btn-save" class="px-6 py-3 bg-indigo-600 text-white rounded-lg font-semibold hover:bg-indigo-700 transition-colors shadow-md">保存</button>';
  html += '<button id="btn-reset" class="px-6 py-3 bg-red-100 text-red-700 rounded-lg font-semibold hover:bg-red-200 transition-colors">デフォルトに戻す</button>';
  html += '</div>';
  html += '<p id="msg" class="text-center text-sm text-green-600 hidden">保存されました。エディタを再読み込みすると適用されます。</p>';

  app.innerHTML = html;

  // イベント
  document.querySelectorAll('input[data-path]').forEach(input => {
    input.addEventListener('change', () => {
      setVal(config, input.dataset.path, parseFloat(input.value));
    });
  });

  document.getElementById('btn-save').addEventListener('click', () => {
    saveConfig(config);
    document.getElementById('msg').classList.remove('hidden');
    setTimeout(() => document.getElementById('msg').classList.add('hidden'), 3000);
  });

  document.getElementById('btn-reset').addEventListener('click', () => {
    if (confirm('すべての設定をデフォルトに戻しますか？')) {
      localStorage.removeItem('authenticity-editor-config-jp');
      config = JSON.parse(JSON.stringify(DEFAULT_CONFIG));
      render();
    }
  });
}

render();
</script>
</body>
</html>
