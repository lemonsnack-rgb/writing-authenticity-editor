<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>관리자 설정 — 작성 진정성 인증 에디터</title>
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{background:#f3f4f6;margin:0;font-family:'Segoe UI',sans-serif}
input[type=number]{width:80px;padding:4px 8px;border:1px solid #d1d5db;border-radius:6px;font-size:14px;text-align:right}
input[type=number]:focus{outline:none;border-color:#6366f1;box-shadow:0 0 0 2px rgba(99,102,241,.2)}
.section{background:#fff;border-radius:12px;padding:20px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #f3f4f6}
.row:last-child{border-bottom:none}
.label{font-size:13px;color:#374151}
.desc{font-size:11px;color:#9ca3af;margin-top:2px}
</style>
</head>
<body>
<!-- ═══ 로그인 게이트 ═══ -->
<div id="login-gate" style="display:flex;align-items:center;justify-content:center;min-height:100vh">
  <div style="background:#fff;padding:32px;border-radius:16px;box-shadow:0 4px 24px rgba(0,0,0,.1);width:340px;text-align:center">
    <h2 style="font-size:20px;font-weight:700;color:#1f2937;margin:0 0 4px">관리자 설정</h2>
    <p style="font-size:13px;color:#9ca3af;margin:0 0 24px">접속하려면 로그인하세요</p>
    <input id="login-id" type="text" placeholder="아이디" style="width:100%;padding:10px 14px;border:1.5px solid #d1d5db;border-radius:8px;font-size:14px;margin-bottom:10px;outline:none" />
    <input id="login-pw" type="password" placeholder="비밀번호" style="width:100%;padding:10px 14px;border:1.5px solid #d1d5db;border-radius:8px;font-size:14px;margin-bottom:16px;outline:none" />
    <p id="login-err" style="font-size:12px;color:#ef4444;margin:0 0 12px;display:none">아이디 또는 비밀번호가 올바르지 않습니다.</p>
    <button id="login-btn" style="width:100%;padding:12px;background:#6366f1;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer">로그인</button>
  </div>
</div>
<div id="main-content" style="display:none">
<div class="max-w-2xl mx-auto p-6">
  <header class="text-center mb-6">
    <h1 class="text-2xl font-bold text-gray-800">관리자 설정</h1>
    <p class="text-gray-500 text-sm mt-1">분석 임계값, 가중치, 등급 기준을 조정합니다</p>
    <a href="index.html" class="text-xs text-indigo-500 hover:text-indigo-700">← 에디터로 돌아가기</a>
  </header>
  <div id="app"></div>
</div>
</div>
<script>
(function(){
  var _h=function(s){var h=0;for(var i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i);h|=0}return h};
  var _u=-1063142531,_p=1851790850;
  function check(){
    var id=document.getElementById('login-id').value;
    var pw=document.getElementById('login-pw').value;
    if(_h(id)===_u&&_h(pw)===_p){sessionStorage.setItem('auth','1');show()}
    else{document.getElementById('login-err').style.display='block'}
  }
  function show(){document.getElementById('login-gate').style.display='none';document.getElementById('main-content').style.display='block'}
  if(sessionStorage.getItem('auth')==='1')show();
  document.getElementById('login-btn').addEventListener('click',check);
  document.getElementById('login-pw').addEventListener('keydown',function(e){if(e.key==='Enter')check()});
  document.getElementById('login-id').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('login-pw').focus()});
})();
</script>
<script>
// ── config 로드 (index.html과 동일한 구조) ──
const DEFAULT_CONFIG = {
  mechWeights:{typing:1.0,'insert-in-paste':0.7,citation:0.5,'paste-edited':0.3,'paste-clean':0.0},
  behaviorWeights:{nonlinear:0.4,thinking:0.35,editQuality:0.25},
  finalScoreRatio:{mechanical:0.5,behavioral:0.5},
  nonlinear:{scaleFactor:500},
  thinking:{minPauseMs:2000,maxPauseMs:15000,lookAheadOps:3,minDeleteForContent:3,minInsertForContent:2,pauseWeight:3000,scoreScale:200},
  editQuality:{typoMaxLength:2,contentMinDelete:2,contentMinInsert:2},
  grades:{excellent:70,normal:40},
  citation:{contextRange:30,patterns:['["""]','https?:\\/\\/','www\\.','출처','참고','인용','참조','source','ref','cite','\\[\\d+\\]','\\(.*\\d{4}\\)']},
  replay:{minDelayMs:10,maxDelayMs:500,speeds:[1,2,4,8,16]},
  input:{maxIntervalMs:10000},
};
function deepMerge(t,s){const r={...t};for(const k of Object.keys(s)){if(s[k]&&typeof s[k]==='object'&&!Array.isArray(s[k])){r[k]=deepMerge(t[k]||{},s[k])}else{r[k]=s[k]}}return r}
function loadConfig(){try{const s=localStorage.getItem('authenticity-editor-config');if(s)return deepMerge(DEFAULT_CONFIG,JSON.parse(s))}catch(e){}return JSON.parse(JSON.stringify(DEFAULT_CONFIG))}
function saveConfig(c){localStorage.setItem('authenticity-editor-config',JSON.stringify(c))}

let config = loadConfig();

// ── UI 렌더링 ──
const sections = [
  {
    title: '기계적 분석 — 글자 유입 경로별 가중치',
    desc: '각 유형의 글자가 점수에 기여하는 비율 (0.0 ~ 1.0)',
    fields: [
      { path: 'mechWeights.typing', label: '직접 타이핑', desc: '키보드로 직접 입력', step: 0.1 },
      { path: 'mechWeights.insert-in-paste', label: '복붙 내 삽입', desc: '붙여넣기 영역 안에서 직접 입력', step: 0.1 },
      { path: 'mechWeights.citation', label: '인용 붙여넣기', desc: '출처 표기가 있는 붙여넣기', step: 0.1 },
      { path: 'mechWeights.paste-edited', label: '수정된 복붙', desc: '붙여넣기 후 수정된 블록', step: 0.1 },
      { path: 'mechWeights.paste-clean', label: '단순 붙여넣기', desc: '수정 없이 그대로 남은 붙여넣기', step: 0.1 },
    ]
  },
  {
    title: '행동 분석 — 시그널별 가중치',
    desc: '합이 1.0이 되어야 합니다',
    fields: [
      { path: 'behaviorWeights.nonlinear', label: '비선형 편집', desc: '커서 역방향 이동 빈도', step: 0.05 },
      { path: 'behaviorWeights.thinking', label: '사고 정지', desc: '유효 사고 정지 횟수', step: 0.05 },
      { path: 'behaviorWeights.editQuality', label: '수정 패턴 질', desc: '내용 수정 비율', step: 0.05 },
    ]
  },
  {
    title: '종합 점수 — 결합 비율',
    desc: '기계적/행동 점수의 결합 비율 (합 1.0)',
    fields: [
      { path: 'finalScoreRatio.mechanical', label: '기계적 분석 비율', step: 0.1 },
      { path: 'finalScoreRatio.behavioral', label: '행동 분석 비율', step: 0.1 },
    ]
  },
  {
    title: '사고 정지 — 임계값',
    fields: [
      { path: 'thinking.minPauseMs', label: '최소 정지 시간 (ms)', desc: '이 이상 멈추면 사고 정지 후보', step: 500 },
      { path: 'thinking.maxPauseMs', label: '최대 정지 시간 (ms)', desc: '이 이상이면 이탈로 판단', step: 1000 },
      { path: 'thinking.lookAheadOps', label: '검사 오퍼레이션 수', desc: '멈춤 후 이 개수만큼 후속 행동 검사', step: 1 },
      { path: 'thinking.minDeleteForContent', label: '내용 삭제 최소 길이', desc: '이 이상 삭제해야 내용 수정으로 판단', step: 1 },
      { path: 'thinking.minInsertForContent', label: '내용 삽입 최소 길이', desc: '이 이상 삽입해야 내용 수정으로 판단', step: 1 },
    ]
  },
  {
    title: '수정 패턴 질 — 임계값',
    fields: [
      { path: 'editQuality.typoMaxLength', label: '오타 최대 길이', desc: '이 이하 삭제+삽입은 오타 수정으로 분류', step: 1 },
      { path: 'editQuality.contentMinDelete', label: '내용 수정 최소 삭제', step: 1 },
      { path: 'editQuality.contentMinInsert', label: '내용 수정 최소 삽입', step: 1 },
    ]
  },
  {
    title: '등급 커트라인',
    fields: [
      { path: 'grades.excellent', label: '우수 최소 점수', step: 5 },
      { path: 'grades.normal', label: '보통 최소 점수', step: 5 },
    ]
  },
  {
    title: '인용 감지',
    fields: [
      { path: 'citation.contextRange', label: '주변 검색 범위 (글자 수)', step: 5 },
    ]
  },
  {
    title: '기타',
    fields: [
      { path: 'nonlinear.scaleFactor', label: '비선형 스케일 팩터', step: 50 },
      { path: 'input.maxIntervalMs', label: '입력 간격 최대 (ms)', step: 1000 },
      { path: 'replay.minDelayMs', label: '재생 최소 딜레이 (ms)', step: 5 },
      { path: 'replay.maxDelayMs', label: '재생 최대 딜레이 (ms)', step: 50 },
    ]
  },
];

function getVal(obj, path) {
  return path.split('.').reduce((o, k) => o?.[k], obj);
}
function setVal(obj, path, val) {
  const keys = path.split('.');
  let o = obj;
  for (let i = 0; i < keys.length - 1; i++) o = o[keys[i]];
  o[keys[keys.length - 1]] = val;
}

function render() {
  const app = document.getElementById('app');
  let html = '';

  sections.forEach(sec => {
    html += '<div class="section">';
    html += '<h2 class="text-sm font-bold text-gray-700 mb-1">' + sec.title + '</h2>';
    if (sec.desc) html += '<p class="text-xs text-gray-400 mb-3">' + sec.desc + '</p>';
    sec.fields.forEach(f => {
      const val = getVal(config, f.path);
      html += '<div class="row">';
      html += '<div><div class="label">' + f.label + '</div>';
      if (f.desc) html += '<div class="desc">' + f.desc + '</div>';
      html += '</div>';
      html += '<input type="number" value="' + val + '" step="' + (f.step || 1) + '" data-path="' + f.path + '" />';
      html += '</div>';
    });
    html += '</div>';
  });

  // 버튼
  html += '<div class="flex gap-3 justify-center mt-6 mb-4">';
  html += '<button id="btn-save" class="px-6 py-3 bg-indigo-600 text-white rounded-lg font-semibold hover:bg-indigo-700 transition-colors shadow-md">저장</button>';
  html += '<button id="btn-reset" class="px-6 py-3 bg-red-100 text-red-700 rounded-lg font-semibold hover:bg-red-200 transition-colors">기본값 복원</button>';
  html += '</div>';
  html += '<p id="msg" class="text-center text-sm text-green-600 hidden">저장되었습니다. 에디터를 새로고침하면 적용됩니다.</p>';

  app.innerHTML = html;

  // 이벤트
  document.querySelectorAll('input[data-path]').forEach(input => {
    input.addEventListener('change', () => {
      setVal(config, input.dataset.path, parseFloat(input.value));
    });
  });

  document.getElementById('btn-save').addEventListener('click', () => {
    saveConfig(config);
    document.getElementById('msg').classList.remove('hidden');
    setTimeout(() => document.getElementById('msg').classList.add('hidden'), 3000);
  });

  document.getElementById('btn-reset').addEventListener('click', () => {
    if (confirm('모든 설정을 기본값으로 복원하시겠습니까?')) {
      localStorage.removeItem('authenticity-editor-config');
      config = JSON.parse(JSON.stringify(DEFAULT_CONFIG));
      render();
    }
  });
}

render();
</script>
</body>
</html>
